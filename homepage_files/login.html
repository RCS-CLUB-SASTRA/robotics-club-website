<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCS LOGIN PAGE</title>
    <link rel="shortcut icon" href="rcs.png" type="image/png">
    <link rel="stylesheet" href="stylelogin.css">
</head>
<body>
    <div class="border">
        <div class="header">
            <img src="rcs.png" alt="RCS Logo" class="logo">
        </div>
        <div class="content">
            <h2>Login to RCS</h2>
            <form action="login_process.php" method="POST" class="forms">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
                <br><br>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <br><br>
                <input type="submit" value="Login" class="button">
            </form>
            <br>
            <a href="REG.html">New user? Register here</a>
        </div>
    </div>
</body>
</html>
